imu_filter:
  ros__parameters:
    use_mag: false
    publish_tf: true
    # sonar_link is the parent of sonar_imu_link; publish the inverse
    # orientation TF so sonar_imu_link does not have a second parent.
    reverse_tf: true
    fixed_frame: world
    world_frame: enu
    gain: 0.1
    zeta: 0.0
    remove_gravity_vector: false
    constant_dt: 0.0
